<div class="common-list-grid">
  {% for project in site.data.about.projects %}
  <div class="glass-card project-card common-item-row">
    <div class="item-header-grid">
      <h3 class="item-title">{{ project.title }}</h3>
      <span class="item-period">{{ project.date }}</span>
    </div>
    <p class="item-subtitle">{{ project.context }}</p>
  </div>
  {% endfor %}
</div>
