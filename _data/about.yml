bio: |
  I am a **2nd-year Master's student** at Seoul National University Graduate School of Data Science (**SNU GSDS**), and a member of [**CODE lab**](https://codelab.snu.ac.kr/), advised by [**Prof. Hyojin Sung**](https://hsung.snu.ac.kr/bio).

  My research focuses on **compiler-level optimizations** and building **efficient software infrastructures** for heterogeneous systems, including GPUs, Processing-In-Memory (PIM), and edge AI accelerators.

